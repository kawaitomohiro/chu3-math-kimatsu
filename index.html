<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>中3数学 期末テスト対策</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;color:#1c2330;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;font-size:18px;line-height:1.75}
#app{max-width:1120px;margin:0 auto;padding:18px 20px 60px}
i{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.12em;padding:0 1px}
sup{font-size:.7em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.2;margin:0 3px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.fr>span{padding:0 4px}
.hd h1{margin:6px 0 2px;font-size:30px}
.hd p{margin:0 0 14px;color:#445}
.sm{font-size:14px;color:#667;margin-left:8px}
.sum{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sum>div{background:#fff;border-radius:12px;padding:10px 18px;min-width:150px;box-shadow:0 1px 3px #0001}
.sum b{font-size:28px;margin-right:2px}
.sum span{display:block;font-size:13px;color:#667}
.sum .warn{background:#fff3e6;outline:2px solid #f0a040}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.mode{border:0;border-radius:14px;padding:16px;text-align:left;color:#fff;cursor:pointer;font:inherit;box-shadow:0 2px 6px #0002}
.mode b{display:block;font-size:21px;margin-bottom:4px}
.mode span{font-size:14px;line-height:1.5;display:block}
.mode em{font-style:normal;background:#fff;color:#c33;border-radius:99px;padding:0 9px;margin-left:8px;font-size:16px}
.m1{background:#d9482b}.m2{background:#c27a00}.m3{background:#1f4e9c}.m4{background:#2a8a5c}
.mode:hover{filter:brightness(1.08)}
.box{background:#fff;border-radius:12px;padding:12px 20px;box-shadow:0 1px 3px #0001}
.weakbox h2{font-size:18px;margin:4px 0}
.weakbox ul{margin:4px 0;padding-left:22px;font-size:16px;line-height:1.7}
.sec{font-size:20px;margin:22px 0 8px}
.unit{background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 3px #0001}
.unit summary{padding:12px 18px;cursor:pointer;display:flex;align-items:center;gap:10px}
.unit summary b{font-size:18px}
.unit summary .sm2{margin-left:auto}
.tl{width:100%;border-collapse:collapse}
.tl td,.tl th{padding:7px 18px;border-top:1px solid #e6e9ef;text-align:left;font-size:16px}
.tl .rc{white-space:nowrap;width:120px}
.tl td:last-child{width:120px;text-align:right}
.bd{font-size:12px;border-radius:99px;padding:1px 9px;margin-left:8px;white-space:nowrap}
.bd.w{background:#fde3dd;color:#b3321a}.bd.n{background:#fff0cc;color:#8a5a00}.bd.s{background:#e3ecfb;color:#1f4e9c}
.btn{font:inherit;font-size:16px;border:1.5px solid #1f4e9c;background:#fff;color:#1f4e9c;border-radius:9px;padding:6px 14px;cursor:pointer}
.btn:hover{background:#eaf1fc}
.btn.big{background:#1f4e9c;color:#fff;font-size:19px;padding:10px 26px;font-weight:bold}
.btn.big:hover{background:#173d7c}
.btn.ghost{border-color:#aab;color:#556}
.btn.ok{border-color:#1a9c5a;color:#fff;background:#1a9c5a;font-size:18px;padding:9px 22px}
.btn.ng{border-color:#c33;color:#c33}
.btn:disabled{opacity:.35;cursor:default}
.foot{margin-top:26px;font-size:14px;color:#667}
.top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.mn{font-weight:bold;font-size:19px}
.pg{margin-left:auto;color:#445}
.tm{background:#1c2330;color:#fff;border-radius:8px;padding:2px 12px;font-variant-numeric:tabular-nums}
.tm.hot{background:#c33}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.nb{font:inherit;font-size:14px;width:36px;height:32px;border:1.5px solid #bcc3d1;background:#fff;border-radius:7px;cursor:pointer}
.nb.done{background:#dbe7fb;border-color:#1f4e9c}.nb.cur{outline:3px solid #f0a040}
.nb.o{background:#d9f3e4;border-color:#1a9c5a}.nb.x{background:#fde0dc;border-color:#c33}
.card{background:#fff;border-radius:14px;padding:18px 26px 22px;box-shadow:0 2px 8px #0001}
.qhead{display:flex;align-items:center;gap:10px;border-bottom:2px solid #e6e9ef;padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}
.un{background:#1c2330;color:#fff;border-radius:6px;padding:0 10px;font-size:14px}
.tn{font-weight:bold}
.qbody.hasfig{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:start}
.qtext{font-size:20px}
.qfig{max-width:660px}
.note{display:block;font-size:14px;color:#667;line-height:1.5;margin-top:2px}
.figs{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.cap{font-size:14px;color:#445;font-weight:bold}
svg{max-width:100%;height:auto}
svg text{font-family:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif}
.gl{stroke:#222;stroke-width:1.8;stroke-linecap:round}.gd{stroke-dasharray:5 4}.gt{stroke-width:1;stroke:#666}
.gar{fill:none;stroke:#222;stroke-width:1.3}.gtk{stroke:#222;stroke-width:1.4}
.garc{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:3 3}
.gpt{font-size:17px;text-anchor:middle;fill:#111}
.gln{font-size:15px;text-anchor:middle;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.gan{font-size:13px;text-anchor:middle;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:3px}
.gg{stroke:#c9d6ea;stroke-width:1}.gax{stroke:#222;stroke-width:1.5}
.gtx{font-size:12px;fill:#333}.gxl,.gyl{font-size:14px;fill:#111}.gtt{font-size:14px;paint-order:stroke;stroke:#fff;stroke-width:4px}
.tb{border-collapse:collapse;font-size:16px;background:#fff}
.tb td,.tb th{border:1px solid #889;padding:2px 14px;text-align:right}
.tb th{background:#eef1f6;text-align:center}
.work{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:16px;align-items:start}
.part{padding:10px 0;border-top:1px dashed #d5dae3}
.plabel{font-size:19px;margin-bottom:4px}
.line{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:21px}
.fld{display:inline-flex;align-items:center;justify-content:center;min-width:86px;min-height:52px;padding:2px 10px;border:2px solid #8b97ab;border-radius:9px;background:#fff;font-size:24px;cursor:pointer;font-family:"Times New Roman",serif}
.fld.wide{min-width:120px}
.fld.on{border-color:#e07b00;box-shadow:0 0 0 4px #ffe2b8;background:#fffaf2}
.fld.on:after{content:"";width:2px;height:26px;background:#e07b00;margin-left:2px;animation:bl 1s steps(1) infinite}

.fld.lock{background:#f1f3f7;cursor:default}
.opts{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.opts.pic{flex-direction:row;flex-wrap:wrap}
.opt{font:inherit;font-size:19px;text-align:left;border:2px solid #bcc3d1;background:#fff;border-radius:10px;padding:7px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:#1f4e9c}
.opt.sel{border-color:#1f4e9c;background:#e4eefc;box-shadow:0 0 0 2px #1f4e9c inset}
.opt.lock{cursor:default}
.opt.good{border-color:#1a9c5a;background:#dff5ea;box-shadow:0 0 0 2px #1a9c5a inset}
.opt.bad{border-color:#c33;background:#fde6e3;box-shadow:0 0 0 2px #c33 inset}
.ck{display:inline-block;width:22px;height:22px;border:2px solid #8b97ab;border-radius:5px;line-height:18px;text-align:center;font-size:16px;flex:none;background:#fff}
.fillbox{font-size:19px;line-height:2.5;background:#f7f9fc;border-radius:10px;padding:8px 16px}
.sel{font:inherit;font-size:17px;padding:5px 6px;border:2px solid #8b97ab;border-radius:8px;background:#fffaf2;max-width:100%}
.sel.good{border-color:#1a9c5a;background:#dff5ea}.sel.bad{border-color:#c33;background:#fde6e3}
.fixans{color:#c33;font-weight:bold;margin:0 6px}
.plot{display:inline-block;cursor:crosshair;border:2px solid #8b97ab;border-radius:10px;padding:4px;background:#fff}
.plot.lock{cursor:default}
.right{font-size:17px;color:#b3321a;margin-top:6px}
.right .line{display:inline-flex;font-size:19px}
.ra{font-size:22px;font-family:"Times New Roman",serif;margin:0 4px}
.mark{display:inline-block;margin-top:6px;font-weight:bold;border-radius:8px;padding:1px 14px;font-size:18px}
.mark.o{background:#dff5ea;color:#12784a}.mark.x{background:#fde6e3;color:#b3321a}
.mark span{font-weight:normal;margin-left:10px;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:sticky;top:10px;background:#eef1f6;border-radius:14px;padding:12px}
.key{font:inherit;font-size:24px;height:54px;border:0;border-radius:10px;background:#fff;box-shadow:0 2px 0 #b9c1cf;cursor:pointer}
.key:active{transform:translateY(2px);box-shadow:none}
.key.fn{font-size:13px;background:#dfe5ee}
.key.go{background:#1f4e9c;color:#fff;font-size:17px;font-weight:bold;box-shadow:0 2px 0 #12336b}
.kpn{grid-column:1/-1;font-size:12.5px;color:#556;line-height:1.5}
.warnbar{color:#b3321a;font-size:16px;min-height:6px;margin-top:6px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.info{flex-basis:100%;border-radius:8px;padding:4px 14px;font-size:16px}
.info.ok{background:#dff5ea;color:#12784a}.info.ng{background:#fff0cc;color:#7a4f00}
.expl{margin-top:16px;background:#fffbea;border-left:6px solid #e3b400;border-radius:8px;padding:12px 20px;font-size:18px;line-height:2.1}
.mt{font-weight:bold;font-size:15px;color:#7a5f00;margin-bottom:2px}
.proof{background:#fff;border:1.5px solid #ccd;border-radius:8px;padding:8px 16px;margin:6px 0;line-height:2}
.model{background:#f1f7ff;border-radius:10px;padding:10px 16px;margin-bottom:10px}
.checks{background:#f7f9fc;border-radius:10px;padding:10px 16px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:17px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:6px;flex:none}
.selfb{display:flex;gap:12px;margin-top:12px}
.score{font-size:22px;text-align:center;margin:6px 0 12px}
.score b{font-size:64px;color:#1f4e9c}
.score span{font-size:15px;color:#667;margin-left:8px}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rrow{font:inherit;font-size:15px;text-align:left;display:flex;gap:10px;align-items:center;border:1.5px solid #ccd;border-radius:8px;background:#fff;padding:5px 10px;cursor:pointer}

.rrow b{width:26px;text-align:right}.mk{font-weight:bold;width:22px}
.rrow.x .mk{color:#c33}.rrow.o .mk{color:#1a9c5a}
#ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
.dlg{background:#fff;border-radius:16px;padding:22px 30px;max-width:520px;box-shadow:0 10px 40px #0005}
.dlg h3{margin:0 0 6px;font-size:22px}
.dbt{display:flex;gap:12px;justify-content:flex-end;margin-top:14px}
@media(max-width:900px){.modes{grid-template-columns:1fr 1fr}.work{grid-template-columns:1fr}.qbody.hasfig{grid-template-columns:1fr}.rl{grid-template-columns:1fr}.kp{position:static}}

</style>

<script>
/* ===== 土台：乱数・分数・表示・図・グラフ ===== */
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcd(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) { var t = a % b; a = b; b = t; } return a || 1; }

/* 分数 {n,d}。F(3,4)  F(2.5)  F({n,d}) */
function F(n, d) {
  if (n && typeof n === 'object') { if (d === undefined) return n; n = n.n / n.d; }
  if (d === undefined) d = 1;
  if (d && typeof d === 'object') { n = n * d.d; d = d.n; }
  var k = 0;
  while ((Math.abs(n - Math.round(n)) > 1e-9 || Math.abs(d - Math.round(d)) > 1e-9) && k < 6) { n *= 10; d *= 10; k++; }
  n = Math.round(n); d = Math.round(d);
  if (d < 0) { n = -n; d = -d; }
  var g = gcd(n, d);
  return { n: n / g, d: d / g };
}
function fadd(a, b) { a = F(a); b = F(b); return F(a.n * b.d + b.n * a.d, a.d * b.d); }
function fsub(a, b) { a = F(a); b = F(b); return F(a.n * b.d - b.n * a.d, a.d * b.d); }
function fmul(a, b) { a = F(a); b = F(b); return F(a.n * b.n, a.d * b.d); }
function fdiv(a, b) { a = F(a); b = F(b); return F(a.n * b.d, a.d * b.n); }
function fval(a) { a = F(a); return a.n / a.d; }
function feq(a, b) { a = F(a); b = F(b); return a.n === b.n && a.d === b.d; }
function fneg(a) { a = F(a); return F(-a.n, a.d); }
function fabs(a) { a = F(a); return F(Math.abs(a.n), a.d); }

/* 表示 */
function frac(n, d) { return '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>'; }
function fh(a) { a = F(a); var s = a.n < 0 ? '−' : ''; var n = Math.abs(a.n); return a.d === 1 ? s + n : s + frac(n, a.d); }
function ft(a) { a = F(a); var s = a.n < 0 ? '−' : ''; var n = Math.abs(a.n); return a.d === 1 ? s + n : s + n + '/' + a.d; }
function dn(x) { var v = Math.round(fval(F(x)) * 10000) / 10000; return String(v).replace('-', '−'); }
function pn(a) { a = F(a); return a.n < 0 ? '(' + fh(a) + ')' : fh(a); }
function co(a) { a = F(a); if (a.n === 1 && a.d === 1) return ''; if (a.n === -1 && a.d === 1) return '−'; return fh(a); }
var X2 = '<i>x</i><sup>2</sup>';
function yax(a) { return '<i>y</i> = ' + co(a) + X2; }
function lin(m, n) {
  m = F(m); n = F(n);
  var s = '<i>y</i> = ';
  if (m.n !== 0) s += co(m) + '<i>x</i>';
  if (n.n !== 0) s += (m.n !== 0 ? (n.n > 0 ? ' + ' : ' − ') + fh(fabs(n)) : fh(n));
  if (m.n === 0 && n.n === 0) s += '0';
  return s;
}
function v(s) { return '<i>' + s + '</i>'; }

/* 入力文字列 → 分数（だめなら null） */
function parseNum(str) {
  if (str === undefined || str === null) return null;
  str = String(str).replace(/−/g, '-').replace(/\s/g, '');
  var m = /^(-?)(\d+(?:\.\d+)?)(?:\/(\d+))?$/.exec(str);
  if (!m) return null;
  var n = parseFloat(m[2]), d = m[3] ? parseFloat(m[3]) : 1;
  if (!d) return null;
  if (m[1]) n = -n;
  return F(n, d);
}

/* ===== 図形の図 ===== */
var _gid = 0;
function geo(o) {
  var P = o.pts, names = Object.keys(P), w = o.w || 300, pad = o.pad || 36, hmax = o.hmax || 250;

  var s = Math.min((w - 2 * pad) / dx, (hmax - 2 * pad) / dy);
  var h = dy * s + 2 * pad, ox = (w - dx * s) / 2;
  function T(k) { var p = typeof k === 'string' ? P[k] : k; return [ox + (p[0] - minx) * s, h - pad - (p[1] - miny) * s]; }
  var hide = o.hide || '';
  var vis = names.filter(function (k) { return hide.indexOf(k) < 0; });
  if (!vis.length) vis = names;
  var cx = 0, cy = 0;
  vis.forEach(function (k) { var t = T(k); cx += t[0]; cy += t[1]; });
  cx /= vis.length; cy /= vis.length;
  var out = '<svg class="geo" viewBox="0 0 ' + w + ' ' + Math.round(h) + '" width="' + w + '" height="' + Math.round(h) + '">';
  (o.fill || []).forEach(function (f) {
    var poly = Array.isArray(f) ? f : f.split('');
    out += '<polygon points="' + poly.map(function (k) { return T(k).map(r1).join(','); }).join(' ') + '" fill="#ffd9d2" stroke="none"/>';
  });
  function seg(sg, cls) { var a = T(sg[0]), b = T(sg[1]); return '<line x1="' + r1(a[0]) + '" y1="' + r1(a[1]) + '" x2="' + r1(b[0]) + '" y2="' + r1(b[1]) + '" class="' + cls + '"/>'; }
  (o.segs || []).forEach(function (sg) { out += seg(sg, 'gl'); });
  (o.dash || []).forEach(function (sg) { out += seg(sg, 'gl gd'); });
  (o.thin || []).forEach(function (sg) { out += seg(sg, 'gl gt'); });
  /* 平行の印 */
  (o.par || []).forEach(function (sg) {
    var a = T(sg[0]), b = T(sg[1]); if (a[0] > b[0]) { var t = a; a = b; b = t; }
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    var p1 = [mx - ux * 5 - uy * 4, my - uy * 5 + ux * 4], p2 = [mx + ux * 3, my + uy * 3], p3 = [mx - ux * 5 + uy * 4, my - uy * 5 - ux * 4];
    out += '<polyline points="' + [p1, p2, p3].map(function (p) { return r1(p[0]) + ',' + r1(p[1]); }).join(' ') + '" class="gar"/>';
  });
  /* 等しい長さの印 */
  (o.ticks || []).forEach(function (tk) {
    var a = T(tk[0][0]), b = T(tk[0][1]), n = tk[1] || 1, L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    for (var i = 0; i < n; i++) { var c = [(a[0] + b[0]) / 2 + ux * (i - (n - 1) / 2) * 4, (a[1] + b[1]) / 2 + uy * (i - (n - 1) / 2) * 4]; out += '<line x1="' + r1(c[0] - uy * 5) + '" y1="' + r1(c[1] + ux * 5) + '" x2="' + r1(c[0] + uy * 5) + '" y2="' + r1(c[1] - ux * 5) + '" class="gtk"/>'; }
  });
  /* 直角 */
  (o.rights || []).forEach(function (r) {
    var p = T(r[0]), a = T(r[1]), b = T(r[2]);
    var la = Math.hypot(a[0] - p[0], a[1] - p[1]) || 1, lb = Math.hypot(b[0] - p[0], b[1] - p[1]) || 1, q = 9;
    var u = [(a[0] - p[0]) / la * q, (a[1] - p[1]) / la * q], w2 = [(b[0] - p[0]) / lb * q, (b[1] - p[1]) / lb * q];
    out += '<polyline points="' + r1(p[0] + u[0]) + ',' + r1(p[1] + u[1]) + ' ' + r1(p[0] + u[0] + w2[0]) + ',' + r1(p[1] + u[1] + w2[1]) + ' ' + r1(p[0] + w2[0]) + ',' + r1(p[1] + w2[1]) + '" class="gar"/>';
  });
  /* 角 */
  (o.angs || []).forEach(function (g) {
    var p = T(g[0]), a = T(g[1]), b = T(g[2]), rr = g[4] || 17;
    var a1 = Math.atan2(a[1] - p[1], a[0] - p[0]), a2 = Math.atan2(b[1] - p[1], b[0] - p[0]);
    var d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;

function parabLine() {

  var g = { xmin: p - 1, xmax: q + 1, ymin: lo - 1, ymax: hi + 1, sx: 24, sy: Math.min(24, 220 / yr), gy: yr > 24 ? 5 : (yr > 12 ? 2 : 1), noticks: 1 };
  g.curves = [{ f: function (x) { return fval(a) * x * x; } }, { f: function (x) { return fval(m) * x + fval(n); }, c: '#333', w: 1.8 }];
  g.dots = [{ x: p, y: ya, label: 'A', c: '#d23', dx: -16, dy: a.n > 0 ? -6 : 16 }, { x: q, y: yb, label: 'B', c: '#d23', dx: 8, dy: a.n > 0 ? 4 : 14 }];
  g.segs = [{ a: [p, 0], b: [p, ya], c: '#888', dash: 1, w: 1 }, { a: [q, 0], b: [q, yb], c: '#888', dash: 1, w: 1 }];
  g.texts = [{ x: p, y: a.n > 0 ? -0.6 * (yr / 12 + 0.4) : 0.6 * (yr / 12 + 0.4), t: mn(p), anchor: 'middle' }, { x: q, y: a.n > 0 ? -0.6 * (yr / 12 + 0.4) : 0.6 * (yr / 12 + 0.4), t: String(q), anchor: 'middle' }];

}

  return { t0: t0, f0: f0, d: d, steps: steps, g: { xmin: 0, xmax: 8, ymin: 0, ymax: ymax, sx: 30, sy: 150 / ymax, gy: 100, yt: 200, xt: 1, padL: 44, xl: '<tspan font-style="italic">x</tspan>(時間)', yl: '<tspan font-style="italic">y</tspan>(円)' }, fee: function (x) { return x <= t0 ? f0 : f0 + d * Math.ceil(x - t0); } };
}

  S.res = judgeProblem(S.prob, S.ans); S.judged = true;
  var s = stat(S.prob.type); s.n++;
  if (S.res.ok) { s.ok++; S.right++; if (s.need > 0) s.need--; } else s.need = 2;
  save(); drawProblem();
}

/* ---------- 入力 ---------- */
function fieldEl(f) { return app.querySelector('.fld[data-p="' + f[0] + '"][data-f="' + f[1] + '"]'); }
function setFocus(f) { var o = app.querySelector('.fld.on'); if (o) o.classList.remove('on'); S.focus = f; var e = fieldEl(f); if (e) e.classList.add('on'); }
function allFields() { var r = []; S.prob.parts.forEach(function (p, i) { if (p.kind === 'nums') p.ans.forEach(function (a, j) { r.push([i, j]); }); }); return r; }
function nextField() { var fs = allFields(), k = -1; fs.forEach(function (f, i) { if (S.focus && f[0] === S.focus[0] && f[1] === S.focus[1]) k = i; }); if (fs.length) setFocus(fs[(k + 1) % fs.length]); }
function typeKey(k) {
  if (!S.prob || S.judged || S.mode === 'review') return;
  if (k === 'ok') { if (S.mode === 'test') { saveTest(); if (S.test.i < S.test.probs.length - 1) gotoTest(S.test.i + 1); } else doJudge(); return; }
  if (k === 'nx') { nextField(); return; }
  if (!S.focus) return;
  var cur = S.ans[S.focus[0]][S.focus[1]] || '';
  if (k === 'del') cur = cur.slice(0, -1);
  else if (k === '-') cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur;
  else if (k === '/') { if (cur.indexOf('/') < 0 && /\d$/.test(cur)) cur += '/'; }
  else if (k === '.') { var seg = cur.split('/').pop(); if (seg.indexOf('.') < 0 && /\d$/.test(cur)) cur += '.'; }
  else if (cur.replace('-', '').length < 9) cur += k;
  S.ans[S.focus[0]][S.focus[1]] = cur;
  var e = fieldEl(S.focus); if (e) e.innerHTML = showIn(cur);
  var w = document.getElementById('warn'); if (w) w.innerHTML = '';
}
document.addEventListener('keydown', function (e) {
  if (document.getElementById('ov')) { if (e.key === 'Escape') closeMsg(); return; }
  if (!S.prob || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.tagName === 'SELECT') return;
  if (S.judged && e.key === 'Enter' && S.mode !== 'review' && S.mode !== 'test') { e.preventDefault(); next(); return; }
  if (/^[0-9]$/.test(e.key)) typeKey(e.key);
  else if (e.key === '-' || e.key === '−') typeKey('-');
  else if (e.key === '/') { e.preventDefault(); typeKey('/'); }
  else if (e.key === '.') typeKey('.');
  else if (e.key === 'Backspace') { e.preventDefault(); typeKey('del'); }
  else if (e.key === 'Tab') { e.preventDefault(); typeKey('nx'); }
  else if (e.key === 'Enter') { e.preventDefault(); typeKey('ok'); }
});
app.addEventListener('change', function (e) {
  var t = e.target;
  if (t.classList.contains('sel') && !S.judged) S.ans[+t.dataset.p][+t.dataset.b] = +t.value;
});
app.addEventListener('click', function (e) {
  var t = e.target.closest('[data-k],[data-act],.fld,.opt,.plot');
  if (!t) return;
  if (t.dataset.k) { typeKey(t.dataset.k); return; }
  if (t.classList.contains('fld')) { if (!S.judged) setFocus([+t.dataset.p, +t.dataset.f]); return; }
  if (t.classList.contains('opt')) {
    if (S.judged || S.mode === 'review') return;
    var pi = +t.dataset.p, i = +t.dataset.i, p = S.prob.parts[pi];
    if (p.kind === 'choice') { S.ans[pi] = i; t.parentNode.querySelectorAll('.opt').forEach(function (o) { o.classList.toggle('sel', o === t); }); }
    else { var k = S.ans[pi].indexOf(i); if (k >= 0) S.ans[pi].splice(k, 1); else S.ans[pi].push(i); t.classList.toggle('sel', k < 0); t.querySelector('.ck').textContent = k < 0 ? '✓' : ''; }
    return;
  }
  if (t.classList.contains('plot')) {
    if (S.judged || S.mode === 'review') return;
    var pp = +t.dataset.p, q = S.prob.parts[pp], svg = t.querySelector('svg'), rc = svg.getBoundingClientRect(), m = q.g._m, sc2 = m.W / rc.width;
    var x = Math.round(q.g.xmin + ((e.clientX - rc.left) * sc2 - m.L) / m.sx), y = Math.round(q.g.ymax - ((e.clientY - rc.top) * sc2 - m.T) / m.sy);
    if (x < q.g.xmin || x > q.g.xmax || y < q.g.ymin || y > q.g.ymax) return;
    var arr = S.ans[pp], f = -1; arr.forEach(function (c, j) { if (c[0] === x && c[1] === y) f = j; });
    if (f >= 0) arr.splice(f, 1); else arr.push([x, y]);
    t.innerHTML = plotSvg(q, arr, false); return;
  }
  var a = t.dataset.act;
  if (a === 'weak' || a === 'fix') start(a);
  else if (a === 'all') start('unit', 0);
  else if (a === 'unit') { e.preventDefault(); start('unit', +t.dataset.u); }
  else if (a === 'type') { stopTimer(); start('type', t.dataset.id); }
  else if (a === 'test') msg('模擬テストを始めます', '50分・25問・100点満点です。ノートと筆記用具を用意しましょう。とちゅうでは丸つけをしません。最後にまとめて丸つけをして、解説を見ます。', [['始める', startTest], ['やめる', null]]);
  else if (a === 'judge') doJudge();
  else if (a === 'skip') doJudge(true);
  else if (a === 'next') next();
  else if (a === 'again') next(true);
  else if (a === 'show') { S.ans[+t.dataset.p].shown = true; redrawParts(); }
  else if (a === 'self') { S.ans[+t.dataset.p].res = t.dataset.v; if (S.prob.parts.every(function (q, i) { return q.kind !== 'self' || S.ans[i].res; })) doJudge(true); }
  else if (a === 'quit') { if (S.mode === 'review') showResult(); else if (S.mode === 'test') msg('テストをやめますか', 'ここまでの答えは消えます。', [['テストをやめる', home], ['続ける', null]]); else home(); }
  else if (a === 'reset') msg('記録をぜんぶ消しますか', '解いた数・まちがい直し・模擬テストの記録がすべて消えます。元にもどせません。', [['消す', function () { ST = { types: {}, tests: [] }; save(); home(); }], ['やめる', null]]);
  else if (a === 'prev') { saveTest(); gotoTest(S.test.i - 1); }
  else if (a === 'tnext') { saveTest(); gotoTest(S.test.i + 1); }
  else if (a === 'goto') { saveTest(); gotoTest(+t.dataset.i); }
  else if (a === 'finish') { saveTest(); var left = S.test.probs.filter(function (q, i) { return !answered(q, S.test.answers[i]); }).length; msg('テストを終わって丸つけしますか', left ? 'まだ答えていない問題が ' + left + ' 問あります。' : '全部の問題に答えています。', [['丸つけする', finishTest], ['もどって続ける', null]]); }
  else if (a === 'home') home();
  else if (a === 'review') { S.mode = 'review'; gotoTest(+t.dataset.i); }
  else if (a === 'msg') { var fn = MSG[+t.dataset.i]; closeMsg(); if (fn) fn(); }
});
function redrawParts() { var y = window.scrollY; document.getElementById('parts').innerHTML = S.prob.parts.map(function (q, i) { return partHtml(q, i, S.ans[i], S.judged, null); }).join(''); window.scrollTo(0, y); }

/* ---------- メッセージ（alert・confirm のかわり） ---------- */
var MSG = [];
function msg(title, body, btns) {
  closeMsg(); MSG = btns.map(function (b) { return b[1]; });
  var d = document.createElement('div'); d.id = 'ov';
  d.innerHTML = '<div class="dlg"><h3>' + title + '</h3><p>' + body + '</p><div class="dbt">' + btns.map(function (b, i) { return '<button class="btn' + (i === 0 ? ' big' : '') + '" data-act="msg" data-i="' + i + '">' + b[0] + '</button>'; }).join('') + '</div></div>';
  d.addEventListener('click', function (e) { var t = e.target.closest('[data-act="msg"]'); if (!t) return; var fn = MSG[+t.dataset.i]; closeMsg(); if (fn) fn(); });
  document.body.appendChild(d);
}
function closeMsg() { var o = document.getElementById('ov'); if (o) o.parentNode.removeChild(o); }

/* ---------- 模擬テスト ---------- */
var QUOTA = { 1: 4, 2: 4, 3: 2, 4: 3, 5: 2, 6: 2, 7: 3, 8: 3, 9: 2 };
function startTest() {
  var probs = [];
  for (var u = 1; u < UNITS.length; u++) {
    var pool = TYPES.filter(function (t) { return t.unit === u && t.auto; }), k = QUOTA[u];
    while (k-- > 0 && pool.length) { var t = wpick(pool); pool = pool.filter(function (x) { return x !== t; }); probs.push(makeProblem(t.id)); }
  }
  S.mode = 'test'; S.test = { probs: probs, answers: probs.map(function (p) { return p.parts.map(blankAns); }), i: 0, start: Date.now(), limit: 50 * 60, results: null };
  stopTimer(); S.timer = setInterval(tick, 1000); gotoTest(0);
}
function saveTest() { if (S.mode === 'test') S.test.answers[S.test.i] = S.ans; }
function gotoTest(i) {
  S.test.i = i; setProblem(S.test.probs[i], S.test.answers[i]);
  if (S.mode === 'review') { S.judged = true; S.res = S.test.results[i]; S.focus = null; }
  drawProblem();
}
function tick() {
  if (S.mode !== 'test') return;
  var left = S.test.limit - Math.floor((Date.now() - S.test.start) / 1000), e = document.getElementById('tm');
  if (left <= 0) { saveTest(); finishTest(); msg('時間です', '50分がたちました。丸つけをしました。', [['結果を見る', null]]); return; }
  if (e) { e.textContent = '残り ' + Math.floor(left / 60) + ' 分 ' + ('0' + left % 60).slice(-2) + ' 秒'; e.className = 'tm' + (left < 300 ? ' hot' : ''); }
}
function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function finishTest() {
  stopTimer();
  var T2 = S.test, per = 100 / T2.probs.length, score = 0;
  T2.results = T2.probs.map(function (p, i) { var r = judgeProblem(p, T2.answers[i]); score += per * r.frac; var s = stat(p.type); s.n++; if (r.ok) { s.ok++; if (s.need > 0) s.need--; } else s.need = 2; return r; });
  T2.score = Math.round(score); T2.min = Math.max(1, Math.round((Date.now() - T2.start) / 60000));
  var d = new Date(); ST.tests.push({ date: (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2), score: T2.score, min: T2.min });
  save(); showResult();
}
function showResult() {
  var T2 = S.test; S.mode = 'result'; S.prob = null;
  var h = '<div class="top"><button class="btn ghost" data-act="home">← ホームへ</button><span class="mn">模擬テストの結果</span></div><div class="card"><div class="score"><b>' + T2.score + '</b> 点<span>（100点満点・' + T2.min + ' 分）</span></div>';
  h += '<table class="tl"><tr><th>単元</th><th>正解</th></tr>';
  for (var u = 1; u < UNITS.length; u++) { var idx = []; T2.probs.forEach(function (p, i) { if (p.unit === u) idx.push(i); }); if (idx.length) h += '<tr><td>' + UNITS[u] + '</td><td>' + idx.filter(function (i) { return T2.results[i].ok; }).length + ' / ' + idx.length + '</td></tr>'; }
  h += '</table><h3>1問ずつふり返る（押すと、自分の答え・正しい答え・解説が出ます）</h3><div class="rl">' + T2.probs.map(function (p, i) { var r = T2.results[i]; return '<button class="rrow ' + (r.ok ? 'o' : 'x') + '" data-act="review" data-i="' + i + '"><b>' + (i + 1) + '</b><span class="mk">' + (r.ok ? '○' : (r.frac > 0 ? '△' : '×')) + '</span><span>' + esc(p.name) + '</span></button>'; }).join('') + '</div>';
  var bad = T2.results.filter(function (r) { return !r.ok; }).length;
  h += '<div class="actions">' + (bad ? '<button class="btn big" data-act="fix">まちがえた ' + bad + ' 問の型を、数字を変えてやり直す</button>' : '') + '<button class="btn" data-act="home">ホームへ</button></div></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
}
/* 点検用：#g=単元番号 で、その単元の型を全部、正しい答えつきで並べる */
function gallery(u) {
  var h = '<div class="top"><button class="btn ghost" data-act="home">← ホームへ</button><span class="mn">点検用の一覧</span></div>';
  TYPES.filter(function (t) { return !u || t.unit === u; }).forEach(function (t) {
    var p = makeProblem(t.id), a = p.parts.map(rightAns), r = judgeProblem(p, a);
    h += '<div class="card" style="margin-bottom:14px" data-gid="' + t.id + '"><div class="qhead"><span class="un">' + t.id + '</span><span class="tn">' + esc(t.name) + '</span></div><div class="qbody' + (p.fig ? ' hasfig' : '') + '"><div class="qtext">' + p.html + '</div>' + (p.fig ? '<div class="qfig">' + p.fig + '</div>' : '') + '</div><div class="parts">' + p.parts.map(function (q, i) { return partHtml(q, i, a[i], true, r.parts[i]); }).join('') + '</div><div class="expl">' + p.expl + '</div></div>';
  });
  S.prob = null; app.innerHTML = h;
}
function figGallery(u) {
  var h = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
  TYPES.filter(function (t) { return !u || t.unit === u; }).forEach(function (t) {
    for (var k = 0; k < 2; k++) {
      var p = makeProblem(t.id), extra = p.parts.map(function (q) { return q.kind === 'plot' ? plotSvg(q, q.pts, true) : ((q.opts || []).join('').indexOf('<svg') >= 0 ? '<div class="figs">' + q.opts.map(function (o, i) { return '<div style="border:' + (i === q.ans || (q.ans.indexOf && q.ans.indexOf(i) >= 0) ? '3px solid #1a9c5a' : '1px solid #ccc') + '">' + o + '</div>'; }).join('') + '</div>' : ''); }).join('');
      var ex = (p.expl.match(/<svg[\s\S]*?<\/svg>/) || [''])[0];
      if (p.fig || extra || ex) h += '<div class="box" style="padding:6px;overflow:hidden"><b>' + t.id + '</b> ' + (p.fig || '') + extra + ex + '</div>';
    }
  });
  S.prob = null; app.style.maxWidth = '1500px'; app.innerHTML = h + '</div>';
}
var HG = /^#([gf])=(\d+)$/.exec(location.hash);
if (HG) (HG[1] === 'g' ? gallery : figGallery)(+HG[2]); else home();

</script>
</body>
