<style>

</style>

<script>
/* ===== 土台：乱数・分数・表示・図・グラフ ===== */
function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function gcd(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) { var t = a % b; a = b; b = t; } return a || 1; }

/* 分数 {n,d}。F(3,4)  F(2.5)  F({n,d}) */
function F(n, d) {
  if (n && typeof n === 'object') { if (d === undefined) return n; n = n.n / n.d; }
  if (d === undefined) d = 1;
  if (d && typeof d === 'object') { n = n * d.d; d = d.n; }
  var k = 0;
  while ((Math.abs(n - Math.round(n)) > 1e-9 || Math.abs(d - Math.round(d)) > 1e-9) && k < 6) { n *= 10; d *= 10; k++; }
  n = Math.round(n); d = Math.round(d);
  if (d < 0) { n = -n; d = -d; }
  var g = gcd(n, d);
  return { n: n / g, d: d / g };
}
function fadd(a, b) { a = F(a); b = F(b); return F(a.n * b.d + b.n * a.d, a.d * b.d); }
function fsub(a, b) { a = F(a); b = F(b); return F(a.n * b.d - b.n * a.d, a.d * b.d); }
function fmul(a, b) { a = F(a); b = F(b); return F(a.n * b.n, a.d * b.d); }
function fdiv(a, b) { a = F(a); b = F(b); return F(a.n * b.d, a.d * b.n); }
function fval(a) { a = F(a); return a.n / a.d; }
function feq(a, b) { a = F(a); b = F(b); return a.n === b.n && a.d === b.d; }
function fneg(a) { a = F(a); return F(-a.n, a.d); }
function fabs(a) { a = F(a); return F(Math.abs(a.n), a.d); }

/* 表示 */
function frac(n, d) { return '<span class="fr"><span>' + n + '</span><span>' + d + '</span></span>'; }
function fh(a) { a = F(a); var s = a.n < 0 ? '−' : ''; var n = Math.abs(a.n); return a.d === 1 ? s + n : s + frac(n, a.d); }
function ft(a) { a = F(a); var s = a.n < 0 ? '−' : ''; var n = Math.abs(a.n); return a.d === 1 ? s + n : s + n + '/' + a.d; }
function dn(x) { var v = Math.round(fval(F(x)) * 10000) / 10000; return String(v).replace('-', '−'); }
function pn(a) { a = F(a); return a.n < 0 ? '(' + fh(a) + ')' : fh(a); }
function co(a) { a = F(a); if (a.n === 1 && a.d === 1) return ''; if (a.n === -1 && a.d === 1) return '−'; return fh(a); }
var X2 = '<i>x</i><sup>2</sup>';
function yax(a) { return '<i>y</i> = ' + co(a) + X2; }
function lin(m, n) {
  m = F(m); n = F(n);
  var s = '<i>y</i> = ';
  if (m.n !== 0) s += co(m) + '<i>x</i>';
  if (n.n !== 0) s += (m.n !== 0 ? (n.n > 0 ? ' + ' : ' − ') + fh(fabs(n)) : fh(n));
  if (m.n === 0 && n.n === 0) s += '0';
  return s;
}
function v(s) { return '<i>' + s + '</i>'; }

/* 入力文字列 → 分数（だめなら null） */
function parseNum(str) {
  if (str === undefined || str === null) return null;
  str = String(str).replace(/−/g, '-').replace(/\s/g, '');
  var m = /^(-?)(\d+(?:\.\d+)?)(?:\/(\d+))?$/.exec(str);
  if (!m) return null;
  var n = parseFloat(m[2]), d = m[3] ? parseFloat(m[3]) : 1;
  if (!d) return null;
  if (m[1]) n = -n;
  return F(n, d);
}

/* ===== 図形の図 ===== */
var _gid = 0;
function geo(o) {
  var P = o.pts, names = Object.keys(P), w = o.w || 300, pad = o.pad || 36, hmax = o.hmax || 250;
  var xs = names.map(function (k) { return P[k][0]; }), ys = names.map(function (k) { return P[k][1]; });
  var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
  var dx = (maxx - minx) || 1, dy = (maxy - miny) || 1;
  var s = Math.min((w - 2 * pad) / dx, (hmax - 2 * pad) / dy);
  var h = dy * s + 2 * pad, ox = (w - dx * s) / 2;
  function T(k) { var p = typeof k === 'string' ? P[k] : k; return [ox + (p[0] - minx) * s, h - pad - (p[1] - miny) * s]; }
  var hide = o.hide || '';
  var vis = names.filter(function (k) { return hide.indexOf(k) < 0; });
  if (!vis.length) vis = names;
  var cx = 0, cy = 0;
  vis.forEach(function (k) { var t = T(k); cx += t[0]; cy += t[1]; });
  cx /= vis.length; cy /= vis.length;
  var out = '<svg class="geo" viewBox="0 0 ' + w + ' ' + Math.round(h) + '" width="' + w + '" height="' + Math.round(h) + '">';
  (o.fill || []).forEach(function (f) {
    var poly = Array.isArray(f) ? f : f.split('');
    out += '<polygon points="' + poly.map(function (k) { return T(k).map(r1).join(','); }).join(' ') + '" fill="#ffd9d2" stroke="none"/>';
  });
  function seg(sg, cls) { var a = T(sg[0]), b = T(sg[1]); return '<line x1="' + r1(a[0]) + '" y1="' + r1(a[1]) + '" x2="' + r1(b[0]) + '" y2="' + r1(b[1]) + '" class="' + cls + '"/>'; }
  (o.segs || []).forEach(function (sg) { out += seg(sg, 'gl'); });
  (o.dash || []).forEach(function (sg) { out += seg(sg, 'gl gd'); });
  (o.thin || []).forEach(function (sg) { out += seg(sg, 'gl gt'); });
  /* 平行の印 */
  (o.par || []).forEach(function (sg) {
    var a = T(sg[0]), b = T(sg[1]); if (a[0] > b[0]) { var t = a; a = b; b = t; }
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    var p1 = [mx - ux * 5 - uy * 4, my - uy * 5 + ux * 4], p2 = [mx + ux * 3, my + uy * 3], p3 = [mx - ux * 5 + uy * 4, my - uy * 5 - ux * 4];
    out += '<polyline points="' + [p1, p2, p3].map(function (p) { return r1(p[0]) + ',' + r1(p[1]); }).join(' ') + '" class="gar"/>';
  });
  /* 等しい長さの印 */
  (o.ticks || []).forEach(function (tk) {
    var a = T(tk[0][0]), b = T(tk[0][1]), n = tk[1] || 1, L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    for (var i = 0; i < n; i++) { var c = [(a[0] + b[0]) / 2 + ux * (i - (n - 1) / 2) * 4, (a[1] + b[1]) / 2 + uy * (i - (n - 1) / 2) * 4]; out += '<line x1="' + r1(c[0] - uy * 5) + '" y1="' + r1(c[1] + ux * 5) + '" x2="' + r1(c[0] + uy * 5) + '" y2="' + r1(c[1] - ux * 5) + '" class="gtk"/>'; }
  });
  /* 直角 */
  (o.rights || []).forEach(function (r) {

function g3aAns(x) { var f = F(x); return f.d === 1 ? '<b>' + dn(x) + '</b>' : '<b>' + dn(x) + '</b>（分数で書くと <b>' + fh(f) + '</b>）'; }
function g3aVal(x) { var f = F(x); return f.d === 1 ? dn(x) : dn(x) + '（分数で書くと ' + fh(f) + '）'; }
/* 比 a : b をもっとも簡単な整数の比になおす。line＝式、how＝どうやったか、m,n＝結果 */
function g3aSimp(a, b) {
  var r = ratioInt(a, b), m = r[0], n = r[1], k = a / m, base = dn(a) + ' : ' + dn(b), res = m + ' : ' + n;
  if (Math.abs(k - 1) < 1e-9) return { m: m, n: n, line: base, how: 'これ以上かんたんにできないので、このまま使う。' };
  if (Math.abs(k - Math.round(k)) < 1e-9) return { m: m, n: n, line: base + ' = ' + res, how: '両方を ' + dn(k) + ' でわって、かんたんな比にした。' };
  var a10 = Math.round(a * 10), b10 = Math.round(b * 10), g = gcd(a10, b10);
  if (g === 1) return { m: m, n: n, line: base + ' = ' + res, how: '小数があるので、両方を 10 倍して整数の比にした。' };
  return { m: m, n: n, line: base + ' = ' + a10 + ' : ' + b10 + ' = ' + res, how: '小数があるので、まず両方を 10 倍して整数にした。次に両方を ' + g + ' でわって、かんたんな比にした。' };
}
/* 比例式 t[0] : t[1] = t[2] : t[3]（1つだけ null＝求める文字 vn）を解くステップ3つ。corr＝対応の説明 */
function g3aProp(t, vn, corr) {
  var X = v(vn), i = t.indexOf(null), s = t.map(function (x) { return x === null ? X : dn(x); });
  var coef = t[3 - i], oth = (i === 0 || i === 3) ? [1, 2] : [0, 3], prod = t[oth[0]] * t[oth[1]], val = prod / coef, outer = (i === 0 || i === 3);
  var steps = [
    ['比例式をつくる', corr + eq(s[0] + ' : ' + s[1] + ' = ' + s[2] + ' : ' + s[3])],
    ['外側どうし・内側どうしをかける', '比例式では、<b>外側の2つをかけた数</b>と<b>内側の2つをかけた数</b>が等しい。外側は ' + s[0] + ' と ' + s[3] + '、内側は ' + s[1] + ' と ' + s[2] + '。' + eq(s[0] + ' × ' + s[3] + ' = ' + s[1] + ' × ' + s[2]) +
      '数字だけの' + (outer ? '右' : '左') + 'がわを計算する。' + dn(t[oth[0]]) + ' × ' + dn(t[oth[1]]) + ' = ' + dn(prod) + '。' + X + ' のあるほうは ' + dn(coef) + X + ' と書く。' + eq(dn(coef) + X + ' = ' + dn(prod))],
    [X + ' を求める', Math.abs(coef - 1) < 1e-9 ? X + ' の前の数が 1 なので、これがそのまま答えになる。' + eq(X + ' = ' + dn(val)) : X + ' だけにするために、両辺を ' + dn(coef) + ' でわる。' + eq(X + ' = ' + dn(prod) + ' ÷ ' + dn(coef), X + ' = ' + g3aVal(val))]
  ];
  return { steps: steps, val: val, line: s[0] + ' : ' + s[1] + ' = ' + s[2] + ' : ' + s[3] };
}

/* y = a × x² のとちゅうの式（代入 → 2乗 → 結果）を1行で */

  closeMsg(); MSG = btns.map(function (b) { return b[1]; });
  var d = document.createElement('div'); d.id = 'ov';
  d.innerHTML = '<div class="dlg"><h3>' + title + '</h3><p>' + body + '</p><div class="dbt">' + btns.map(function (b, i) { return '<button class="btn' + (i === 0 ? ' big' : '') + '" data-act="msg" data-i="' + i + '">' + b[0] + '</button>'; }).join('') + '</div></div>';
  d.addEventListener('click', function (e) { var t = e.target.closest('[data-act="msg"]'); if (!t) return; var fn = MSG[+t.dataset.i]; closeMsg(); if (fn) fn(); });
  document.body.appendChild(d);
}
function closeMsg() { var o = document.getElementById('ov'); if (o) o.parentNode.removeChild(o); }

/* ---------- 模擬テスト ---------- */
var QUOTA = { 1: 4, 2: 4, 3: 2, 4: 3, 5: 2, 6: 2, 7: 3, 8: 3, 9: 2 };
function startTest() {
  var probs = [];
  for (var u = 1; u < UNITS.length; u++) {
    var pool = TYPES.filter(function (t) { return t.unit === u && t.auto; }), k = QUOTA[u];
    while (k-- > 0 && pool.length) { var t = wpick(pool); pool = pool.filter(function (x) { return x !== t; }); probs.push(makeProblem(t.id)); }
  }
  S.mode = 'test'; S.test = { probs: probs, answers: probs.map(function (p) { return p.parts.map(blankAns); }), i: 0, start: Date.now(), limit: 50 * 60, results: null };
  stopTimer(); S.timer = setInterval(tick, 1000); gotoTest(0);
}
function saveTest() { if (S.mode === 'test') S.test.answers[S.test.i] = S.ans; }
function gotoTest(i) {
  S.test.i = i; setProblem(S.test.probs[i], S.test.answers[i]);
  if (S.mode === 'review') { S.judged = true; S.res = S.test.results[i]; S.focus = null; }
  drawProblem();
}
function tick() {
  if (S.mode !== 'test') return;
  var left = S.test.limit - Math.floor((Date.now() - S.test.start) / 1000), e = document.getElementById('tm');
  if (left <= 0) { saveTest(); finishTest(); msg('時間です', '50分がたちました。丸つけをしました。', [['結果を見る', null]]); return; }
  if (e) { e.textContent = '残り ' + Math.floor(left / 60) + ' 分 ' + ('0' + left % 60).slice(-2) + ' 秒'; e.className = 'tm' + (left < 300 ? ' hot' : ''); }
}
function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function finishTest() {
  stopTimer();
  var T2 = S.test, per = 100 / T2.probs.length, score = 0;
  T2.results = T2.probs.map(function (p, i) { var r = judgeProblem(p, T2.answers[i]); score += per * r.frac; var s = stat(p.type); s.n++; if (r.ok) { s.ok++; if (s.need > 0) s.need--; } else s.need = 2; return r; });
  T2.score = Math.round(score); T2.min = Math.max(1, Math.round((Date.now() - T2.start) / 60000));
  var d = new Date(); ST.tests.push({ date: (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2), score: T2.score, min: T2.min });
  save(); showResult();
}
function showResult() {
  var T2 = S.test; S.mode = 'result'; S.prob = null;
  var h = '<div class="top"><button class="btn ghost" data-act="home">← ホームへ</button><span class="mn">模擬テストの結果</span></div><div class="card"><div class="score"><b>' + T2.score + '</b> 点<span>（100点満点・' + T2.min + ' 分）</span></div>';
  h += '<table class="tl"><tr><th>単元</th><th>正解</th></tr>';
  for (var u = 1; u < UNITS.length; u++) { var idx = []; T2.probs.forEach(function (p, i) { if (p.unit === u) idx.push(i); }); if (idx.length) h += '<tr><td>' + UNITS[u] + '</td><td>' + idx.filter(function (i) { return T2.results[i].ok; }).length + ' / ' + idx.length + '</td></tr>'; }
  h += '</table><h3>1問ずつふり返る（押すと、自分の答え・正しい答え・解説が出ます）</h3><div class="rl">' + T2.probs.map(function (p, i) { var r = T2.results[i]; return '<button class="rrow ' + (r.ok ? 'o' : 'x') + '" data-act="review" data-i="' + i + '"><b>' + (i + 1) + '</b><span class="mk">' + (r.ok ? '○' : (r.frac > 0 ? '△' : '×')) + '</span><span>' + esc(p.name) + '</span></button>'; }).join('') + '</div>';
  var bad = T2.results.filter(function (r) { return !r.ok; }).length;
  h += '<div class="actions">' + (bad ? '<button class="btn big" data-act="fix">まちがえた ' + bad + ' 問の型を、数字を変えてやり直す</button>' : '') + '<button class="btn" data-act="home">ホームへ</button></div></div>';
  app.innerHTML = h; window.scrollTo(0, 0);
}
/* 点検用：#g=単元番号 で、その単元の型を全部、正しい答えつきで並べる */
function gallery(u) {
  var h = '<div class="top"><button class="btn ghost" data-act="home">← ホームへ</button><span class="mn">点検用の一覧</span></div>';
  TYPES.filter(function (t) { return !u || t.unit === u; }).forEach(function (t) {
    var p = makeProblem(t.id), a = p.parts.map(rightAns), r = judgeProblem(p, a);
    h += '<div class="card" style="margin-bottom:14px" data-gid="' + t.id + '"><div class="qhead"><span class="un">' + t.id + '</span><span class="tn">' + esc(t.name) + '</span></div><div class="qbody' + (p.fig ? ' hasfig' : '') + '"><div class="qtext">' + p.html + '</div>' + (p.fig ? '<div class="qfig">' + p.fig + '</div>' : '') + '</div><div class="parts">' + p.parts.map(function (q, i) { return partHtml(q, i, a[i], true, r.parts[i]); }).join('') + '</div><div class="expl">' + p.expl + '</div></div>';
  });
  S.prob = null; app.innerHTML = h;
}
function figGallery(u) {
  var h = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">';
  TYPES.filter(function (t) { return !u || t.unit === u; }).forEach(function (t) {
    for (var k = 0; k < 2; k++) {
      var p = makeProblem(t.id), extra = p.parts.map(function (q) { return q.kind === 'plot' ? plotSvg(q, q.pts, true) : ((q.opts || []).join('').indexOf('<svg') >= 0 ? '<div class="figs">' + q.opts.map(function (o, i) { return '<div style="border:' + (i === q.ans || (q.ans.indexOf && q.ans.indexOf(i) >= 0) ? '3px solid #1a9c5a' : '1px solid #ccc') + '">' + o + '</div>'; }).join('') + '</div>' : ''); }).join('');
      var ex = (p.expl.match(/<svg[\s\S]*?<\/svg>/) || [''])[0];
      if (p.fig || extra || ex) h += '<div class="box" style="padding:6px;overflow:hidden"><b>' + t.id + '</b> ' + (p.fig || '') + extra + ex + '</div>';
    }
  });
  S.prob = null; app.style.maxWidth = '1500px'; app.innerHTML = h + '</div>';
}
var HG = /^#([gf])=(\d+)$/.exec(location.hash);
if (HG) (HG[1] === 'g' ? gallery : figGallery)(+HG[2]); else home();

</script>
